<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casa das Flores — Floricultura Artesanal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slateMist: '#899aa1',
                        dustyRose: '#bda2a2',
                        warmPeach: '#fbbe9a',
                        softGold: '#fad889',
                        creamIvory: '#faf5c8',
                        warmTaupe: '#96958a',
                        sageMoss: '#76877d',
                        eucalyptus: '#88b8a9',
                        mintLeaf: '#b2cbae',
                        pistachio: '#dbddb4',
                    },
                    fontFamily: {
                        serif: ['Georgia', 'Cambria', '"Times New Roman"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Animação de transição entre páginas via JavaScript */
        .page-transition {
            transition: opacity 0.32s cubic-bezier(0.4, 0, 0.2, 1), transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .page-exit {
            opacity: 0;
            transform: translateY(12px);
        }

        .page-enter {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col bg-creamIvory/45 text-[#2d3430] dark:bg-[#181d1a] dark:text-creamIvory transition-colors duration-300 font-sans antialiased">

    <!-- NAVBAR RESPONSIVA (MOBILE-FIRST) -->
    <header
        class="sticky top-0 z-50 backdrop-blur-md bg-creamIvory/90 dark:bg-[#1e2421]/90 border-b border-pistachio dark:border-sageMoss/30 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">

                <!-- Logo -->
                <button onclick="navigateTo('inicio')"
                    class="flex items-center gap-2.5 text-left group focus:outline-none">
                    <span
                        class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-eucalyptus/30 dark:bg-eucalyptus/20 flex items-center justify-center text-sageMoss dark:text-mintLeaf group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8">
                            <path
                                d="M12 22V12M12 12C12 7 7 4 3 6C3 11 7 13 12 12ZM12 12C12 7 17 4 21 6C21 11 17 13 12 12ZM12 12C9 8 10 3 12 2C14 3 15 8 12 12Z"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </span>
                    <div>
                        <span
                            class="block font-serif text-lg sm:text-xl font-bold tracking-tight text-sageMoss dark:text-pistachio">Casa
                            das Flores</span>
                        <span
                            class="block text-[10px] uppercase tracking-widest text-warmTaupe dark:text-slateMist">Ateliê
                            Botânico</span>
                    </div>
                </button>

                <!-- Menu Desktop -->
                <nav aria-label="Navegação Principal" class="hidden md:flex items-center gap-1 lg:gap-2">
                    <button data-nav="inicio" onclick="navigateTo('inicio')"
                        class="nav-link px-3.5 py-2 rounded-full text-sm font-medium transition-all">Início</button>
                    <button data-nav="catalogo" onclick="navigateTo('catalogo')"
                        class="nav-link px-3.5 py-2 rounded-full text-sm font-medium transition-all">Catálogo</button>
                    <button data-nav="contato" onclick="navigateTo('contato')"
                        class="nav-link px-3.5 py-2 rounded-full text-sm font-medium transition-all">Contato</button>
                </nav>

                <!-- Ações: Tema Claro/Escuro + Botão Mobile -->
                <div class="flex items-center gap-2">
                    <button id="theme-toggle" aria-label="Alternar tema claro e escuro"
                        class="p-2.5 rounded-full bg-pistachio/70 dark:bg-sageMoss/30 text-sageMoss dark:text-softGold hover:bg-softGold/50 dark:hover:bg-sageMoss/50 transition-colors">
                        <!-- Ícone Sol (visível no tema escuro) -->
                        <svg id="icon-sun" class="hidden w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2">
                            <circle cx="12" cy="12" r="4" />
                            <path
                                d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" />
                        </svg>
                        <!-- Ícone Lua (visível no tema claro) -->
                        <svg id="icon-moon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
                        </svg>
                    </button>

                    <!-- Botão Hambúrguer Mobile -->
                    <button id="mobile-menu-btn" aria-label="Abrir menu" aria-expanded="false"
                        class="md:hidden p-2.5 rounded-xl bg-mintLeaf/40 dark:bg-sageMoss/30 text-sageMoss dark:text-creamIvory hover:bg-mintLeaf/70 transition-colors">
                        <svg id="menu-open-icon" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <svg id="menu-close-icon" class="hidden w-6 h-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Menu Dropdown Mobile -->
        <div id="mobile-menu"
            class="hidden md:hidden border-t border-pistachio dark:border-sageMoss/30 bg-creamIvory dark:bg-[#1e2421] px-4 pt-3 pb-5 space-y-1.5 shadow-lg">
            <button data-nav="inicio" onclick="navigateTo('inicio')"
                class="nav-link block w-full text-left px-4 py-2.5 rounded-xl text-base font-medium transition-all">Início</button>
            <button data-nav="catalogo" onclick="navigateTo('catalogo')"
                class="nav-link block w-full text-left px-4 py-2.5 rounded-xl text-base font-medium transition-all">Catálogo</button>
            <button data-nav="contato" onclick="navigateTo('contato')"
                class="nav-link block w-full text-left px-4 py-2.5 rounded-xl text-base font-medium transition-all">Contato</button>
        </div>
    </header>

    <!-- ÁREA DINÂMICA DAS PÁGINAS (INJETADA VIA JAVASCRIPT) -->
    <main id="app-content"
        class="flex-grow page-transition page-enter max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        <!-- O conteúdo será carregado dinamicamente pelo JS -->
    </main>

    <!-- NOTIFICAÇÃO FLUTUANTE (TOAST) -->
    <div id="toast"
        class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 pointer-events-none transition-all duration-300 bg-sageMoss text-creamIvory dark:bg-eucalyptus dark:text-[#181d1a] px-5 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-2.5">
        <span class="w-2.5 h-2.5 rounded-full bg-softGold"></span>
        <span id="toast-message">Ação realizada com sucesso!</span>
    </div>

    <!-- RODAPÉ -->
    <footer
        class="border-t border-pistachio dark:border-sageMoss/30 bg-pistachio/35 dark:bg-[#141816] py-8 transition-colors duration-300">
        <div
            class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-warmTaupe dark:text-slateMist">
            <div class="flex items-center gap-2">
                <span class="font-serif font-semibold text-sageMoss dark:text-pistachio">Casa das Flores</span>
                <span>&bull; Flores frescas colhidas diariamente.</span>
            </div>
            <div class="flex flex-wrap justify-center gap-4">
                <button onclick="navigateTo('inicio')"
                    class="hover:text-sageMoss dark:hover:text-warmPeach transition-colors">Início</button>
                <button onclick="navigateTo('catalogo')"
                    class="hover:text-sageMoss dark:hover:text-warmPeach transition-colors">Catálogo</button>
                <button onclick="navigateTo('contato')"
                    class="hover:text-sageMoss dark:hover:text-warmPeach transition-colors">Encomendas</button>
            </div>
        </div>
    </footer>

    <!-- JAVASCRIPT DE NAVEGAÇÃO SPA, ANIMAÇÕES E TEMA -->
    <script>
        // 1. DADOS DAS PÁGINAS (CONTEÚDO HTML DINÂMICO PARA CADA ITEM DA NAVBAR)
        const pages = {
            inicio: `
        <section class="space-y-12 sm:space-y-16">
          <!-- Hero Mobile-First -->
          <div class="rounded-3xl bg-gradient-to-br from-pistachio/80 via-creamIvory to-warmPeach/40 dark:from-[#232b27] dark:via-[#1e2421] dark:to-sageMoss/25 p-6 sm:p-10 lg:p-14 border border-mintLeaf/60 dark:border-sageMoss/30 shadow-sm">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
              <div class="lg:col-span-7 space-y-5">
                <span class="inline-block px-3.5 py-1 rounded-full text-xs font-semibold tracking-wider uppercase bg-dustyRose/30 text-[#5e4747] dark:bg-dustyRose/25 dark:text-warmPeach">
                  Coleção Primavera &amp; Verão
                </span>
                <h1 class="font-serif text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight text-sageMoss dark:text-creamIvory">
                  Arranjos botânicos que transformam cada ambiente em poesia.
                </h1>
                <p class="text-base sm:text-lg text-warmTaupe dark:text-slateMist max-w-xl leading-relaxed">
                  Criamos buquês autorais, arranjos secos e composições naturais com flores frescas de produtores locais e entrega no mesmo dia.
                </p>
                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                  <button onclick="navigateTo('catalogo')" class="px-6 py-3.5 rounded-full bg-sageMoss text-creamIvory dark:bg-eucalyptus dark:text-[#181d1a] font-semibold text-sm hover:opacity-90 transition-opacity shadow-sm text-center">
                    Explorar Catálogo
                  </button>
                  <button onclick="navigateTo('contato')" class="px-6 py-3.5 rounded-full bg-warmPeach/70 text-[#4a3529] dark:bg-dustyRose/30 dark:text-creamIvory font-semibold text-sm hover:bg-warmPeach transition-colors text-center">
                    Fazer Encomenda
                  </button>
                </div>
              </div>

              <!-- Ilustração Botânica SVG Responsiva -->
              <div class="lg:col-span-5 flex justify-center">
                <div class="w-full max-w-xs sm:max-w-sm aspect-square rounded-3xl bg-mintLeaf/35 dark:bg-sageMoss/20 border border-eucalyptus/40 flex flex-col items-center justify-center p-6 relative overflow-hidden">
                  <div class="absolute -top-8 -right-8 w-32 h-32 rounded-full bg-softGold/40 dark:bg-softGold/15 blur-xl"></div>
                  <div class="absolute -bottom-8 -left-8 w-32 h-32 rounded-full bg-dustyRose/40 dark:bg-dustyRose/15 blur-xl"></div>
                  <svg class="w-40 h-40 sm:w-48 sm:h-48 text-sageMoss dark:text-mintLeaf drop-shadow-sm" viewBox="0 0 200 200" fill="none">
                    <path d="M100 175V85" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path d="M100 140C72 136 60 115 65 98C82 100 96 118 100 140Z" fill="#88b8a9" fill-opacity="0.65"/>
                    <path d="M100 125C128 121 140 100 135 83C118 85 104 103 100 125Z" fill="#b2cbae" fill-opacity="0.8"/>
                    <circle cx="100" cy="68" r="24" fill="#fbbe9a"/>
                    <circle cx="78" cy="76" r="18" fill="#bda2a2"/>
                    <circle cx="122" cy="76" r="18" fill="#fad889"/>
                    <circle cx="100" cy="68" r="10" fill="#faf5c8"/>
                    <rect x="74" y="152" width="52" height="32" rx="8" fill="#899aa1" fill-opacity="0.45" stroke="currentColor" stroke-width="2"/>
                  </svg>
                  <p class="mt-3 font-serif text-sm italic text-sageMoss dark:text-pistachio text-center">
                    "Cada pétala conta uma história."
                  </p>
                </div>
              </div>
            </div>
          </div>

          <!-- Diferenciais em Grid Mobile-First -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
            <div class="p-6 rounded-2xl bg-white/70 dark:bg-[#222925] border border-pistachio dark:border-sageMoss/30 space-y-2.5">
              <div class="w-10 h-10 rounded-xl bg-eucalyptus/30 text-sageMoss dark:text-eucalyptus flex items-center justify-center font-bold">01</div>
              <h2 class="font-serif text-xl font-bold text-sageMoss dark:text-pistachio">Colheita Fresca Diária</h2>
              <p class="text-sm text-warmTaupe dark:text-slateMist leading-relaxed">Trabalhamos diretamente com pequenos floricultores para garantir durabilidade e perfume natural.</p>
            </div>
            <div class="p-6 rounded-2xl bg-white/70 dark:bg-[#222925] border border-pistachio dark:border-sageMoss/30 space-y-2.5">
              <div class="w-10 h-10 rounded-xl bg-warmPeach/45 text-[#6b4935] dark:text-warmPeach flex items-center justify-center font-bold">02</div>
              <h2 class="font-serif text-xl font-bold text-sageMoss dark:text-pistachio">Design Sob Medida</h2>
              <p class="text-sm text-warmTaupe dark:text-slateMist leading-relaxed">Cada composição é montada artesanalmente harmonizando texturas, folhagens e paletas suaves.</p>
            </div>
            <div class="p-6 rounded-2xl bg-white/70 dark:bg-[#222925] border border-pistachio dark:border-sageMoss/30 space-y-2.5 sm:col-span-2 lg:col-span-1">
              <div class="w-10 h-10 rounded-xl bg-softGold/50 text-[#5c4e24] dark:text-softGold flex items-center justify-center font-bold">03</div>
              <h2 class="font-serif text-xl font-bold text-sageMoss dark:text-pistachio">Embalagem Ecológica</h2>
              <p class="text-sm text-warmTaupe dark:text-slateMist leading-relaxed">Papel kraft texturizado, fitas de algodão cru e zero plástico descartável em nossas entregas.</p>
            </div>
          </div>
        </section>
      `,

            catalogo: `
        <section class="space-y-8">
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 border-b border-pistachio dark:border-sageMoss/30 pb-6">
            <div>
              <span class="text-xs uppercase tracking-widest font-semibold text-dustyRose">Curadoria Botânica</span>
              <h1 class="font-serif text-3xl sm:text-4xl font-bold text-sageMoss dark:text-creamIvory mt-1">Nosso Catálogo</h1>
            </div>
            <p class="text-sm text-warmTaupe dark:text-slateMist max-w-md">
              Selecione seu arranjo favorito. Todos acompanham cartão personalizado escrito à mão.
            </p>
          </div>

          <!-- Grid Responsivo de Produtos -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${[
                    { nome: 'Buquê Aurora Rosé', desc: 'Rosas chá, astromélias pêssego, eucalipto cinérea e gypsophila.', preco: 'R$ 149,00', tag: 'Mais Pedido', cor: 'bg-dustyRose/35' },
                    { nome: 'Vaso Sol de Outono', desc: 'Girassóis anões, solidago dourado, craspédias e folhagens de ruscus.', preco: 'R$ 175,00', tag: 'Vaso Incluso', cor: 'bg-softGold/40' },
                    { nome: 'Jardim de Eucalipto', desc: 'Composição minimalista com lírios brancos, lisianthus e mix de verdes.', preco: 'R$ 162,00', tag: 'Aromático', cor: 'bg-eucalyptus/35' },
                    { nome: 'Encanto Pêssego & Mel', desc: 'Dálias, mini rosas salmão, camomila fresca e trigo seco.', preco: 'R$ 189,00', tag: 'Edição Limitada', cor: 'bg-warmPeach/45' },
                    { nome: 'Terrário Bosque Sereno', desc: 'Mini samambaias, fitônias, musgo vivo e pedras naturais em vidro.', preco: 'R$ 135,00', tag: 'Baixa Manutenção', cor: 'bg-mintLeaf/45' },
                    { nome: 'Arranjo Seco Névoa', desc: 'Lavanda desidratada, capim-dos-pampas, statice e folhas preservadas.', preco: 'R$ 158,00', tag: 'Longa Duração', cor: 'bg-slateMist/35' }
                ].map(item => `
              <article class="rounded-2xl bg-white/80 dark:bg-[#222925] border border-pistachio dark:border-sageMoss/30 overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow">
                <div>
                  <div class="h-44 ${item.cor} flex items-center justify-center relative p-6">
                    <span class="absolute top-3 left-3 px-3 py-1 rounded-full text-xs font-semibold bg-creamIvory/90 dark:bg-[#181d1a]/85 text-sageMoss dark:text-pistachio">
                      ${item.tag}
                    </span>
                    <svg class="w-20 h-20 text-sageMoss dark:text-creamIvory opacity-80" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M32 56V28M32 28C22 26 18 18 22 12C28 14 31 20 32 28ZM32 28C42 26 46 18 42 12C36 14 33 20 32 28ZM32 24C28 16 30 8 32 6C34 8 36 16 32 24Z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </div>
                  <div class="p-5 space-y-2">
                    <h2 class="font-serif text-xl font-bold text-sageMoss dark:text-creamIvory">${item.nome}</h2>
                    <p class="text-sm text-warmTaupe dark:text-slateMist leading-relaxed">${item.desc}</p>
                  </div>
                </div>
                <div class="px-5 pb-5 pt-2 flex items-center justify-between border-t border-pistachio/60 dark:border-sageMoss/20">
                  <span class="font-bold text-lg text-sageMoss dark:text-softGold">${item.preco}</span>
                  <button onclick="showToast('“${item.nome}” adicionado ao seu pedido!')" class="px-4 py-2 rounded-full text-xs font-semibold bg-sageMoss text-creamIvory dark:bg-eucalyptus dark:text-[#181d1a] hover:opacity-90 transition-opacity">
                    Encomendar
                  </button>
                </div>
              </article>
            `).join('')}
          </div>
        </section>
      `,

            contato: `
        <section class="max-w-4xl mx-auto space-y-8">
          <div class="text-center space-y-2">
            <span class="text-xs uppercase tracking-widest font-semibold text-dustyRose">Fale Conosco</span>
            <h1 class="font-serif text-3xl sm:text-4xl font-bold text-sageMoss dark:text-creamIvory">Encomendas &amp; Eventos</h1>
            <p class="text-sm sm:text-base text-warmTaupe dark:text-slateMist">
              Quer um buquê personalizado, decoração para casamento ou tirar uma dúvida? Envie sua mensagem.
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            <!-- Informações -->
            <div class="md:col-span-5 rounded-3xl p-6 bg-pistachio/50 dark:bg-[#222925] border border-mintLeaf/60 dark:border-sageMoss/30 space-y-5 flex flex-col justify-between">
              <div class="space-y-4">
                <h2 class="font-serif text-xl font-bold text-sageMoss dark:text-pistachio">Ateliê Físico</h2>
                <p class="text-sm text-warmTaupe dark:text-slateMist">
                  Rua das Acácias, 248 — Jardim Botânico<br/>
                  Segunda a Sábado, das 09h às 19h
                </p>
                <div class="pt-2 space-y-1 text-sm text-sageMoss dark:text-creamIvory">
                  <p><strong>WhatsApp:</strong> (11) 98765-4321</p>
                  <p><strong>E-mail:</strong> ola@casadasflores.com.br</p>
                </div>
              </div>
              <div class="p-4 rounded-2xl bg-warmPeach/40 dark:bg-dustyRose/20 text-xs text-[#4f382b] dark:text-creamIvory">
                Pedidos realizados até às 14h são entregues no mesmo dia em toda a região metropolitana.
              </div>
            </div>

            <!-- Formulário Interativo -->
            <form onsubmit="handleContactSubmit(event)" class="md:col-span-7 rounded-3xl p-6 sm:p-8 bg-white/85 dark:bg-[#222925] border border-pistachio dark:border-sageMoss/30 space-y-4">
              <div>
                <label for="nome" class="block text-xs font-semibold uppercase tracking-wider text-sageMoss dark:text-pistachio mb-1.5">Seu Nome</label>
                <input id="nome" type="text" required placeholder="Ex: Marina Silva" class="w-full px-4 py-2.5 rounded-xl bg-creamIvory/60 dark:bg-[#181d1a] border border-mintLeaf dark:border-sageMoss/40 text-sm focus:outline-none focus:ring-2 focus:ring-eucalyptus" />
              </div>
              <div>
                <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-sageMoss dark:text-pistachio mb-1.5">E-mail ou WhatsApp</label>
                <input id="email" type="text" required placeholder="marina@exemplo.com" class="w-full px-4 py-2.5 rounded-xl bg-creamIvory/60 dark:bg-[#181d1a] border border-mintLeaf dark:border-sageMoss/40 text-sm focus:outline-none focus:ring-2 focus:ring-eucalyptus" />
              </div>
              <div>
                <label for="ocasiao" class="block text-xs font-semibold uppercase tracking-wider text-sageMoss dark:text-pistachio mb-1.5">Motivo do Contato</label>
                <select id="ocasiao" class="w-full px-4 py-2.5 rounded-xl bg-creamIvory/60 dark:bg-[#181d1a] border border-mintLeaf dark:border-sageMoss/40 text-sm focus:outline-none focus:ring-2 focus:ring-eucalyptus">
                  <option>Encomenda de Buquê Personalizado</option>
                  <option>Eventos e Casamentos</option>
                  <option>Dúvidas Gerais</option>
                </select>
              </div>
              <div>
                <label for="mensagem" class="block text-xs font-semibold uppercase tracking-wider text-sageMoss dark:text-pistachio mb-1.5">Mensagem</label>
                <textarea id="mensagem" rows="3" required placeholder="Conte-nos sobre as cores, flores ou data desejada..." class="w-full px-4 py-2.5 rounded-xl bg-creamIvory/60 dark:bg-[#181d1a] border border-mintLeaf dark:border-sageMoss/40 text-sm focus:outline-none focus:ring-2 focus:ring-eucalyptus"></textarea>
              </div>
              <button type="submit" class="w-full py-3 rounded-full bg-sageMoss text-creamIvory dark:bg-eucalyptus dark:text-[#181d1a] font-semibold text-sm hover:opacity-90 transition-opacity shadow-sm">
                Enviar Mensagem
              </button>
            </form>
          </div>
        </section>
      `
        };

        // 2. SISTEMA DE NAVEGAÇÃO SPA COM ANIMAÇÃO DE TRANSIÇÃO
        let currentPage = '';
        const appContent = document.getElementById('app-content');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuOpenIcon = document.getElementById('menu-open-icon');
        const menuCloseIcon = document.getElementById('menu-close-icon');

        function updateActiveNav(pageKey) {
            document.querySelectorAll('.nav-link').forEach(btn => {
                const isTarget = btn.getAttribute('data-nav') === pageKey;
                if (isTarget) {
                    btn.classList.add('bg-sageMoss', 'text-creamIvory', 'dark:bg-eucalyptus', 'dark:text-[#181d1a]', 'shadow-sm');
                    btn.classList.remove('text-sageMoss', 'dark:text-creamIvory', 'hover:bg-pistachio/70', 'dark:hover:bg-sageMoss/25');
                } else {
                    btn.classList.remove('bg-sageMoss', 'text-creamIvory', 'dark:bg-eucalyptus', 'dark:text-[#181d1a]', 'shadow-sm');
                    btn.classList.add('text-sageMoss', 'dark:text-creamIvory', 'hover:bg-pistachio/70', 'dark:hover:bg-sageMoss/25');
                }
            });
        }

        function closeMobileMenu() {
            mobileMenu.classList.add('hidden');
            menuOpenIcon.classList.remove('hidden');
            menuCloseIcon.classList.add('hidden');
            document.getElementById('mobile-menu-btn').setAttribute('aria-expanded', 'false');
        }

        function navigateTo(pageKey) {
            if (!pages[pageKey] || pageKey === currentPage) {
                closeMobileMenu();
                return;
            }

            closeMobileMenu();
            updateActiveNav(pageKey);

            // Inicia animação de saída
            appContent.classList.remove('page-enter');
            appContent.classList.add('page-exit');

            setTimeout(() => {
                // Troca o HTML dinamicamente
                appContent.innerHTML = pages[pageKey];
                currentPage = pageKey;
                window.scrollTo({ top: 0, behavior: 'smooth' });

                // Inicia animação de entrada
                requestAnimationFrame(() => {
                    appContent.classList.remove('page-exit');
                    appContent.classList.add('page-enter');
                });
            }, 240);
        }

        // 3. CONTROLE DO MENU MOBILE
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            const isHidden = mobileMenu.classList.contains('hidden');
            if (isHidden) {
                mobileMenu.classList.remove('hidden');
                menuOpenIcon.classList.add('hidden');
                menuCloseIcon.classList.remove('hidden');
                document.getElementById('mobile-menu-btn').setAttribute('aria-expanded', 'true');
            } else {
                closeMobileMenu();
            }
        });

        // 4. CONTROLE DO TEMA CLARO / ESCURO
        const htmlEl = document.documentElement;
        const themeToggleBtn = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('icon-sun');
        const iconMoon = document.getElementById('icon-moon');

        function applyTheme(isDark) {
            if (isDark) {
                htmlEl.classList.add('dark');
                iconSun.classList.remove('hidden');
                iconMoon.classList.add('hidden');
            } else {
                htmlEl.classList.remove('dark');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }
        }

        // Verifica preferência salva ou do sistema
        const savedTheme = localStorage.getItem('casa-das-flores-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);

        themeToggleBtn.addEventListener('click', () => {
            const willBeDark = !htmlEl.classList.contains('dark');
            applyTheme(willBeDark);
            localStorage.setItem('casa-das-flores-theme', willBeDark ? 'dark' : 'light');
        });

        // 5. FEEDBACK INTERATIVO (TOAST E FORMULÁRIO)
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3200);
        }

        function handleContactSubmit(event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            showToast(`Obrigado, ${nome}! Recebemos sua mensagem.`);
            event.target.reset();
        }

        // Inicializa na página "Início"
        navigateTo('inicio');
    </script>
</body>

</html>
